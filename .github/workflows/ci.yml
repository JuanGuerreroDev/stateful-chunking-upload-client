name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Calidad del código: tipos, tests + cobertura y build en la matriz de Node soportada (NFR-05/09).
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (NFR-10)
        run: pnpm typecheck

      # Contract tests contra snapshots vendorizados = gate de drift de contrato (NFR-13).
      - name: Test + coverage (NFR-09/13)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  # Salud del paquete publicable: supply chain, tamaño del bundle y corrección de exports/tipos.
  package:
    name: package health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Sin vulnerabilidades altas/críticas (NFR-04). El SDK tiene cero deps de runtime.
      - name: Audit (NFR-04)
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm build

      # Núcleo browser ligero y tree-shakeable (NFR-07): < 10 KB min+gzip/brotli.
      - name: Size check (NFR-07)
        run: pnpm size

      # Corrección de la superficie publicada y de los tipos ESM/CJS (NFR-11).
      - name: Publint (NFR-11)
        run: pnpm check:publish

      - name: Are the types wrong? (NFR-11)
        run: pnpm check:exports
